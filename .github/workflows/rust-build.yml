# Rust クライアント/サーバーの CI ビルド (設計: docs/superpowers/specs/2026-07-22-rust-ci-design.md)
# mac は deploy.sh 再利用でバンドルまで、win は x64/arm64 のマトリクスでビルド+診断+収集。
# win-arm64 は x64 ランナー上のクロスビルドのみ (実行検証はしていない)。
name: rust-build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cef-unity-rust/**"
      - ".github/workflows/rust-build.yml"
      - "cef-unity-csharp/**"
  pull_request:
    paths:
      - "cef-unity-rust/**"
      - ".github/workflows/rust-build.yml"
      - "cef-unity-csharp/**"
  workflow_dispatch:

concurrency:
  group: rust-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-14 # arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-mac-${{ hashFiles('cef-unity-rust/Cargo.lock') }}

      # 初回の cargo 実行は CEF (~1GB) ダウンロードを含むため 1 回リトライ
      - name: Unit tests
        working-directory: cef-unity-rust
        run: cargo test --workspace --lib --bins --release || cargo test --workspace --lib --bins --release

      # 既存スクリプト再利用: release ビルド + server.app バンドル + ad-hoc 署名 +
      # cef-unity-unityproject/Assets/CefUnity/Plugins/osx-arm64/ へ配置
      - name: Build and bundle (deploy.sh)
        working-directory: cef-unity-rust
        run: ./deploy.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core unit tests (no Unity)
        run: dotnet test cef-unity-csharp/CefUnity.Tests -c Release --logger "console;verbosity=minimal"

      - name: Zip artifact
        working-directory: cef-unity-unityproject/Assets/CefUnity/Plugins
        run: zip -qry "$GITHUB_WORKSPACE/cef-unity-macos-arm64.zip" osx-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: cef-unity-macos-arm64
          path: cef-unity-macos-arm64.zip

  build-win:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 はホストと同じなので実行を伴うテストもここで回す。
          # arm64 はクロスビルドのみ (x64 ランナー上では実行できない)。
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-win-${{ matrix.arch }}-${{ hashFiles('cef-unity-rust/Cargo.lock') }}

      # クロスビルドは実行できないので x64 のみ。
      - name: Unit tests
        if: matrix.arch == 'x64'
        working-directory: cef-unity-rust
        shell: bash
        run: cargo test --workspace --lib --bins --release || cargo test --workspace --lib --bins --release

      - name: Build
        working-directory: cef-unity-rust
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Setup .NET
        if: matrix.arch == 'x64'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core unit tests (no Unity)
        if: matrix.arch == 'x64'
        run: dotnet test cef-unity-csharp/CefUnity.Tests -c Release --logger "console;verbosity=minimal"

      # --target 指定なので成果物は target/<triple>/release に出る。
      - name: Diagnostics
        working-directory: cef-unity-rust
        shell: bash
        env:
          RELEASE_DIR: target/${{ matrix.target }}/release
        run: |
          echo "=== $RELEASE_DIR の exe/dll ==="
          ls -la "$RELEASE_DIR" | grep -Ei '\.(exe|dll)$' || echo "(なし)"
          echo "=== cef-dll-sys out ==="
          ls -d "$RELEASE_DIR"/build/cef-dll-sys-*/out/* 2>/dev/null || echo "(なし)"
          for d in "$RELEASE_DIR"/build/cef-dll-sys-*/out/cef_windows_*; do
            [ -d "$d" ] || continue
            echo "--- $d ---"
            # head の SIGPIPE (exit 141) を pipefail に拾わせない
            { ls -la "$d" | head -50; } || true
          done

      - name: Collect bundle
        working-directory: cef-unity-rust
        shell: bash
        env:
          RELEASE_DIR: target/${{ matrix.target }}/release
        run: |
          mkdir -p bundle-win
          for f in "$RELEASE_DIR"/cef_unity_rust.dll \
                   "$RELEASE_DIR"/cef-unity-server.exe \
                   "$RELEASE_DIR"/cef-unity-rust-helper.exe; do
            if [ -f "$f" ]; then
              cp "$f" bundle-win/
            else
              echo "SKIP (not found): $f"
            fi
          done
          CEF_DIR=$(ls -d "$RELEASE_DIR"/build/cef-dll-sys-*/out/cef_windows_* 2>/dev/null | head -1)
          if [ -n "$CEF_DIR" ]; then
            # ランタイムに必要なもののみ (include/cmake/libcef_dll/*.lib 等の SDK は除外)。
            # 初回実行の診断でレイアウトはフラット (libcef.dll / *.pak / icudtl.dat /
            # v8_context_snapshot.bin / locales/) と確認済み。
            mkdir -p bundle-win/cef/locales
            for f in "$CEF_DIR"/*.dll "$CEF_DIR"/*.pak "$CEF_DIR"/*.dat \
                     "$CEF_DIR"/*.bin "$CEF_DIR"/*.json; do
              if [ -f "$f" ]; then cp "$f" bundle-win/cef/; fi
            done
            cp -R "$CEF_DIR"/locales/. bundle-win/cef/locales/ 2>/dev/null \
              || echo "SKIP (not found): locales"
          else
            echo "SKIP (not found): cef_windows_* distribution dir"
          fi
          echo "=== bundle-win ==="
          # head の SIGPIPE を避けるためファイル経由で出力
          ls -laR bundle-win > "$RUNNER_TEMP/bundle_list.txt"
          head -80 "$RUNNER_TEMP/bundle_list.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: cef-unity-windows-${{ matrix.arch }}
          path: cef-unity-rust/bundle-win

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PUBLIC リポジトリなので arm64 ネイティブランナーが無料で使える。
          # クロスビルドではないので x64/arm64 で手順が分岐しない。
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-linux-${{ matrix.arch }}-${{ hashFiles('cef-unity-rust/Cargo.lock') }}

      # CEF の実行時依存 (libcef.so が要求する共有ライブラリ)
      - name: Install CEF runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libnspr4 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libgbm1 libgtk-3-0t64 libxcomposite1 libxdamage1 \
            libxfixes3 libxkbcommon0 libxrandr2 libpango-1.0-0 libcairo2 libx11-xcb1 libxss1

      # 初回の cargo 実行は CEF (~1GB) ダウンロードを含むため 1 回リトライ
      - name: Unit tests
        working-directory: cef-unity-rust
        run: cargo test --workspace --lib --bins --release || cargo test --workspace --lib --bins --release

      - name: Build
        working-directory: cef-unity-rust
        run: cargo build --release

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Core unit tests (no Unity)
        run: dotnet test cef-unity-csharp/CefUnity.Tests -c Release --logger "console;verbosity=minimal"

      # ランナーには画面が無い。ここが「真のヘッドレス環境」での初めての検証になる。
      #
      # dotnet publish で Harness を 1 ディレクトリにまとめ、そこへ copy-linux-runtime.sh で
      # ネイティブ成果物を重ねる。csproj の CopyServerApp と .so の <None> は
      # Exists(target/debug/...) 条件付きで、CI は release ビルドのみなので発火しない。
      - name: Harness smoke
        run: |
          dotnet publish cef-unity-csharp/CefUnity.Harness -c Release -o "$RUNNER_TEMP/harness"
          bash cef-unity-rust/copy-linux-runtime.sh "$RUNNER_TEMP/harness" release
          cd "$RUNNER_TEMP/harness"
          ./CefUnity.Harness smoke

      - name: Collect bundle
        working-directory: cef-unity-rust
        run: |
          bash copy-linux-runtime.sh bundle-linux release
          echo "=== bundle-linux ==="
          ls -laR bundle-linux > "$RUNNER_TEMP/bundle_list.txt"
          head -80 "$RUNNER_TEMP/bundle_list.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: cef-unity-linux-${{ matrix.arch }}
          path: cef-unity-rust/bundle-linux

  # 第3弾: タグ push (v*) または手動実行時、ビルド成果物を Plugins/ へコミット (LFS 経由)
  # し、タグ時は GitHub Release を作成する。publish のコミットは Unity 側パスのみ変更する
  # ため paths フィルタに合致せず、再ビルドはトリガーされない (ループ防止)。
  publish:
    needs: [build-mac, build-win, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build & stage CefUnity.Core.dll
        run: |
          bash cef-unity-csharp/build-csharp.sh
          git add cef-unity-unityproject/Assets/CefUnity/Plugins/CefUnity.Core.dll

      - name: Update Plugins (mac)
        run: |
          unzip -oq artifacts/cef-unity-macos-arm64/cef-unity-macos-arm64.zip -d /tmp/mac
          # .meta は Unity 管理なので保持 (--delete は excluded を消さない)
          rsync -a --delete --exclude '*.meta' /tmp/mac/osx-arm64/ \
            cef-unity-unityproject/Assets/CefUnity/Plugins/osx-arm64/

      - name: Update Plugins (win, フラット展開)
        run: |
          for ARCH in x64 arm64; do
            WD=cef-unity-unityproject/Assets/CefUnity/Plugins/win-$ARCH
            SRC=artifacts/cef-unity-windows-$ARCH
            if [ ! -d "$SRC" ]; then
              echo "SKIP (artifact not found): $SRC"
              continue
            fi
            mkdir -p "$WD"
            cp "$SRC/cef_unity_rust.dll" "$SRC/cef-unity-server.exe" "$SRC/cef-unity-rust-helper.exe" "$WD/"
            rsync -a --exclude archive.json "$SRC/cef/" "$WD/"
          done

      # Linux は x64 のみ Unity に配置する。Unity にデスクトップ Linux arm64 の
      # ターゲットが無いため、arm64 はリリース zip のみ (Assets には置かない)。
      - name: Update Plugins (linux, フラット展開)
        run: |
          WORK_DIRECTORY=cef-unity-unityproject/Assets/CefUnity/Plugins/linux-x64
          SOURCE=artifacts/cef-unity-linux-x64
          if [ ! -d "$SOURCE" ]; then
            echo "SKIP (artifact not found): $SOURCE"
          else
            mkdir -p "$WORK_DIRECTORY"
            # .meta は Unity 管理なので保持
            rsync -a --exclude '*.meta' "$SOURCE/" "$WORK_DIRECTORY/"
          fi

      # CEF 更新でファイルが増えると、Unity Editor を起動しないこの job では .meta が
      # 無いままコミットされ、利用側の Unity が GUID をローカル生成して参照がぶれる。
      # パス由来の決定論的 GUID を与えて防ぐ。
      - name: Generate missing .meta
        run: bash cef-unity-unityproject/generate-missing-meta.sh cef-unity-unityproject/Assets/CefUnity/Plugins

      - name: Verify .meta coverage
        run: bash cef-unity-unityproject/generate-missing-meta.sh --check cef-unity-unityproject/Assets/CefUnity/Plugins

      - name: Commit and push via LFS
        run: |
          git config user.name "Juha"
          git config user.email "juhasapps@gmail.com"
          git config lfs.url "${{ secrets.LFS_URL }}"
          git add cef-unity-unityproject/Assets/CefUnity/Plugins
          if git diff --staged --quiet; then
            echo "変更なし — コミットをスキップ"
          else
            git commit -m "Update binaries (${GITHUB_REF_NAME})"
            git push origin main
          fi

      - name: Create GitHub Release (タグ時のみ)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(cef-unity-macos-arm64.zip)
          cp artifacts/cef-unity-macos-arm64/cef-unity-macos-arm64.zip .
          for ARCH in x64 arm64; do
            if [ -d "artifacts/cef-unity-windows-$ARCH" ]; then
              (cd "artifacts/cef-unity-windows-$ARCH" && zip -qry "../../cef-unity-windows-$ARCH.zip" .)
              ASSETS+=("cef-unity-windows-$ARCH.zip")
            fi
            if [ -d "artifacts/cef-unity-linux-$ARCH" ]; then
              (cd "artifacts/cef-unity-linux-$ARCH" && zip -qry "../../cef-unity-linux-$ARCH.zip" .)
              ASSETS+=("cef-unity-linux-$ARCH.zip")
            fi
          done
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --generate-notes
